[pytest]
testpaths = tests
addopts = -ra
markers =
    spark: needs PySpark and Java 17/21; builds small synthetic lakes (slow, ~2-3 min in total)
    bq: needs BigQuery credentials and the QC tables loaded by gcp/load_bq.sh; runs only with --bq-project
filterwarnings =
    ignore::DeprecationWarning
